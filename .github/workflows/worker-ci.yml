name: Worker CI

on:
  push:
    branches: [main, develop]
    paths:
      - "worker/**"
      - "shared/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"
      - "shared/**"
      - ".github/workflows/worker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    # 실제 인프라 대상 테스트용 서비스 (로컬 docker-compose 와 동일 구성).
    # 없으면 해당 테스트는 skip 되지만, CI 에서는 전부 실행되도록 붙인다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kkori
          POSTGRES_USER: kkori
          POSTGRES_PASSWORD: kkori
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kkori -d kkori"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # 테스트가 PR 코드(및 의존성)를 실행하므로 git 설정에 토큰을 남기지 않는다
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "worker/uv.lock"

      - name: Install dependencies
        # 파이썬 버전은 worker/.python-version(3.13)을 uv 가 자동으로 맞춘다
        working-directory: worker
        run: uv sync --locked

      # MinIO 는 시작 명령(server /data)이 필요해 services 로 못 띄운다 → 직접 실행 + 버킷 생성
      - name: Start MinIO and create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kkori -e MINIO_ROOT_PASSWORD=kkori1234 \
            minio/minio server /data
          uv run --project worker python - <<'EOF'
          import time
          import boto3
          from botocore.exceptions import ClientError, EndpointConnectionError

          s3 = boto3.client(
              "s3", endpoint_url="http://localhost:9000",
              aws_access_key_id="kkori", aws_secret_access_key="kkori1234",
              region_name="ap-northeast-2",
          )
          for _ in range(30):  # 기동 대기 (최대 30초)
              try:
                  s3.create_bucket(Bucket="kkori-resumes")
                  print("버킷 생성 완료")
                  break
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                      print("버킷 이미 있음")
                      break
                  time.sleep(1)
              except EndpointConnectionError:
                  time.sleep(1)
          else:
              raise SystemExit("MinIO 기동 실패")
          EOF

      - name: Run tests
        run: uv run --project worker pytest worker
