name: Worker CI

on:
  push:
    branches: [main, develop]
    paths:
      - "worker/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "worker/**"
      - "shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/worker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --package kkori-worker

      - name: Import check
        run: cd worker && uv run --no-sync python -c "import src.main"

      - name: Run tests
        # 테스트 추가 시 수정 (exit 5 = 수집된 테스트 없음 → 통과 처리)
        run: uv run --no-sync --with pytest pytest worker || [ $? -eq 5 ]
