name: Agent CI

on:
  push:
    branches: [main, develop]
    paths:
      - "agent/**"
      - "shared/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "shared/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "agent/uv.lock"

      - name: Install dependencies
        # 파이썬 버전은 agent/.python-version(3.13)을 uv 가 자동으로 맞춘다
        working-directory: agent
        run: uv sync --locked

      - name: Import check
        working-directory: agent
        run: uv run --no-sync python -c "import src.main"

      - name: Run tests
        # LLM 스모크 테스트(tests/test_initial_question_llm.py)는 KKORI_LIVE_LLM 미설정이면 skip 된다 (기본)
        working-directory: agent
        run: uv run --no-sync pytest
