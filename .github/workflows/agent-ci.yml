name: Agent CI

on:
  push:
    branches: [main, develop]
    paths:
      - "agent/**"
      - "shared/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    paths:
      - "agent/**"
      - "shared/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "agent/uv.lock"

      - name: Install dependencies
        # 파이썬 버전은 agent/.python-version(3.13)을 uv 가 자동으로 맞춘다
        working-directory: agent
        run: uv sync --locked

      - name: Import check
        working-directory: agent
        run: uv run --no-sync python -c "import src.main"

      - name: Run tests
        # 테스트 추가 시 수정 (exit 5 = 수집된 테스트 없음 → 통과 처리)
        run: uv run --project agent --no-sync --with pytest pytest agent || [ $? -eq 5 ]
