# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나) — 백엔드(Kkori-Backend) 설정을 미러링, Python 에 맞춤
# ---------------------------------------------------------------- #

# AI가 응답할 때 사용할 기본 언어를 설정합니다. (예: ko-KR, en-US)
language: ko-KR
# AI의 페르소나와 응답 톤앤매너를 지시합니다. 최대 250자 제한 (초과 시 설정 전체가 무시됨).
tone_instructions: >-
  당신은 소프트웨어 마에스트로 멘토입니다. 멘티가 코드 품질을 개선하며 성장하도록 도우세요.
  변경 컴포넌트의 PRD와 연결 이슈를 먼저 확인하고, 요구사항이 구현과 테스트에 반영됐는지 검증하세요.
  예외·권한·보안·데이터 정합성 누락을 우선 지적하고, 문제의 영향과 구체적 개선안을 제시하세요.
  스타일보다 기능 정확성과 안정성을 우선하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰의 전반적인 스타일을 설정합니다. 'chill'은 비교적 덜 엄격하고 부드러운 톤을 의미합니다.
  profile: chill
  # CodeRabbit의 코멘트를 모두 `resolve`하면, 자동으로 Approve를 하는 기능입니다.
  request_changes_workflow: false
  # PR의 전체적인 변경 사항에 대한 고수준의 요약(summary)을 생성할지 여부입니다.
  high_level_summary: true
  # 변경된 각 파일에 대한 요약을 생성할지 여부입니다. (PR이 길어지는 것 방지)
  changed_files_summary: false
  # 코드의 실행 흐름을 보여주는 시퀀스 다이어그램을 생성할지 여부입니다. (PR이 길어지는 것 방지)
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부입니다.
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부입니다.
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부입니다.
  related_prs: false
  # PR에 적절한 레이블을 제안할지 여부입니다.
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부입니다.
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부입니다.
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부입니다.
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부입니다.
  poem: true
  # 특정 파일 경로에 따라 다른 리뷰 지침을 적용합니다.
  path_instructions:
    # 이력서 분석 워커 (Python + FastStream + pgvector)
    - path: "worker/src/**"
      instructions: |
        - worker/docs/requirements/ 의 PRD(계약 §1, 파이프라인 §2, 복구 §3, 포기 §4)와 구현이 일치하는지 확인하세요.
        - Redis Stream 계약(필드 전부 문자열, 상태 8종, message null→"")이 깨지는 변경을 지적하세요 — 변경 권한은 백엔드에 있습니다.
        - at-least-once 전제의 멱등성: 상태 전이가 원자적 CAS(조건부 UPDATE)로 보호되는지, 중복 전달·회수 경합에 안전한지 확인하세요.
        - 산출물 저장과 상태 전이가 같은 트랜잭션으로 묶였는지 확인하세요 (§2.4 불변식).
        - 핸들러의 예외 처리: 정상 반환=ACK(종결), 예외=PEL 잔류(재시도) 의미가 지켜지는지 — 예외를 삼켜서 유실되는 경로를 지적하세요.
        - async 이벤트 루프에서 blocking 호출(boto3·LLM·PyMuPDF)이 스레드로 넘겨지는지 확인하세요.
        - 시각 기록이 UTC-aware(timestamptz)인지 확인하세요. naive datetime 을 지적하세요.
        - 로그·에러 메시지·SSE 이벤트에 자격증명, 개인정보, 내부 예외 상세가 노출되지 않는지 확인하세요.
        - 미작성 테스트 케이스가 있다면 제안하세요 (예: 계약 예시 대조, 파이프라인 시나리오, 실패·재시도 경로).
    # 면접 질문 생성 에이전트
    - path: "agent/src/**"
      instructions: |
        - resume_chunks 를 읽기 전용으로만 접근하는지 확인하세요 — 쓰기는 워커 소유입니다.
        - 검색 질의 임베딩이 워커의 색인과 같은 모델·차원(임베딩 계약)을 쓰는지 확인하세요.
        - 프롬프트에 사용자 개인정보가 불필요하게 포함되지 않는지 확인하세요.
    # 컴포넌트 공용 코드
    - path: "shared/**"
      instructions: |
        - worker 와 agent 양쪽에서 쓰이는 코드입니다 — 한쪽 사정으로 인터페이스를 바꾸면 다른 쪽이 깨지는지 확인하세요.
        - 임베딩 계약(모델 ID·차원·input_type)의 단일 출처가 유지되는지 확인하세요.

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # PR이 생성됐을 때 자동 리뷰 (false 면 `@coderabbitai review` 코멘트로 수동 시작)
    enabled: true
    # 리뷰 후 새 커밋이 추가되면 변경분만 증분 리뷰
    auto_incremental_review: true
    # 스토리 브랜치(feature/HBB1-*)로 향하는 PR 도 자동 리뷰되도록 모든 base 허용
    # (기본값은 기본 브랜치 대상 PR 만 리뷰 — 작업 PR → 스토리 브랜치 구조에서 리뷰가 스킵됨)
    base_branches:
      - ".*"

# ---------------------------------------------------------------- #
# 채팅 기능 설정
# ---------------------------------------------------------------- #
chat:
  # @coderabbitai 태그 없이도 자동으로 답글을 달 수 있도록 설정합니다.
  auto_reply: true

# ---------------------------------------------------------------- #
# CodeRabbit의 지식 기반(Knowledge Base) 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 웹 검색을 통해 최신 정보나 문서를 참조할 수 있도록 허용할지 여부입니다.
  web_search:
    enabled: true
  # PRD·설계 결정 노트를 리뷰 컨텍스트로 학습시킵니다.
  code_guidelines:
    enabled: true
    filePatterns:
      - worker/docs/requirements/**/*.md
      - agent/docs/**/*.md
  # 학습·이슈·PR 참조 범위는 현재 레포지토리로 한정합니다.
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
