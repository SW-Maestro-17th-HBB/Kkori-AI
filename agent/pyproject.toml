[project]
name = "kkori-agent"
version = "0.1.0"
description = "Kkori AI 면접관 LiveKit 에이전트"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents[aws]~=1.6.6",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv~=1.1",
    "redis>=8.0.1",
]

[tool.uv]
# 이 프로젝트 자체를 패키지로 빌드하지 않는다 — 의존성 관리 전용 (worker와 동일)
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
